<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e8c6e">
  <title>HealthPulz · Log in</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <main class="login">
    <div class="login-brand">
      <svg class="brand-mark" aria-hidden="true"><use href="/img/icons.svg#logo"/></svg>
      <h1>HealthPulz</h1>
      <p class="muted">Disease monitoring for the Barangay Health Units of Naval, Biliran</p>
    </div>

    <form id="login-form" class="card login-card" novalidate>
      <div class="field">
        <label for="unit-input">Health unit</label>
        <div class="combobox">
          <input id="unit-input" type="text" role="combobox" autocomplete="off"
                 aria-autocomplete="list" aria-expanded="false" aria-controls="unit-list"
                 placeholder="Type your barangay, or RHU Naval">
          <ul id="unit-list" role="listbox" aria-label="Health units" hidden></ul>
        </div>
      </div>

      <div class="field">
        <label for="password-input">Password</label>
        <div class="password-field">
          <input id="password-input" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false">
          <button id="show-password" class="link-btn small" type="button" aria-pressed="false" aria-label="Show password">Show</button>
        </div>
      </div>

      <button id="login-btn" class="btn btn-primary btn-large btn-block" type="submit" disabled>Log in</button>
      <p id="login-error" class="small login-error" role="alert"></p>
    </form>

    <p class="login-note muted small">
      <svg class="icon" aria-hidden="true"><use href="/img/icons.svg#shield"/></svg>
      Client records stay with their own health unit. RHU Naval receives de-identified reports only.
      Forgot your password? Ask the RHU.
    </p>
  </main>
  <script type="module" src="/js/login/main.js"></script>
</body>
</html>
